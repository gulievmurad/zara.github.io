<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Artwork | Zahra Azimzade</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <a
        href="index.html"
        class="logo"
    >
        Zahra Azimzade
    </a>


    <nav>

        <a
            href="index.html"
            class="nav-link"
        >
            HOME
        </a>

        <a
            href="art.html"
            class="nav-link"
        >
            ART
        </a>

        <a
            href="illustration.html"
            class="nav-link"
        >
            ILLUSTRATION
        </a>

        <a
            href="about.html"
            class="nav-link"
        >
            ABOUT ME
        </a>

        <a
            href="contacts.html"
            class="nav-link"
        >
            CONTACTS
        </a>

    </nav>

</header>



<main>

    <section class="artwork-page">


        <div class="artwork-main">

            <button
                class="artwork-arrow"
                id="artworkPrevious"
            >
                ←
            </button>


            <img
                id="artworkImage"
                src=""
                alt="Artwork"
            >


            <button
                class="artwork-arrow"
                id="artworkNext"
            >
                →
            </button>

        </div>



        <div
            class="image-counter"
            id="imageCounter"
        >
        </div>



        <div
            id="artworkThumbnails"
            class="artwork-thumbnails"
        >
        </div>



        <div class="artwork-information">

            <h1 id="artworkTitle"></h1>


            <p
                id="artworkDescription"
                class="artwork-description"
            >
            </p>


            <div class="artwork-details">

                <p>

                    <strong>
                        Year:
                    </strong>

                    <span id="artworkYear"></span>

                </p>


                <p>

                    <strong>
                        Category:
                    </strong>

                    <span id="artworkCategory"></span>

                </p>


                <p>

                    <strong>
                        Technique:
                    </strong>

                    <span id="artworkTechnique"></span>

                </p>

            </div>

        </div>



        <section class="other-images">

            <h2>
                OTHER WORKS
            </h2>


            <div
                id="otherWorks"
                class="gallery"
            >
            </div>

        </section>


    </section>

</main>



<footer>

    © 2026 Zahra Azimzade

</footer>


<script src="script.js"></script>

</body>

</html>
